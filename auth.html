<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ورود | LoyalForge</title>

  <meta
    name="description"
    content="ورود و ثبت‌نام در LoyalForge"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================================
       LOYALFORGE AUTH
    ========================================================= */

    body.auth-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(142, 216, 255, .08),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(184, 167, 255, .08),
          transparent 32%
        ),
        #07090d;
    }

    .auth-page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          115deg,
          transparent 0%,
          rgba(255,255,255,.015) 50%,
          transparent 100%
        );
    }

    .auth-shell {
      width: min(100% - 32px, 470px);
      position: relative;
      z-index: 2;
    }

    .auth-card {
      padding: 34px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.025)
        );
      box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        0 0 50px rgba(142,216,255,.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
    }

    .auth-logo-mark {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      color: #dff6ff;
      font-family: "Inter", sans-serif;
      font-size: 21px;
      font-weight: 800;
      background:
        linear-gradient(
          135deg,
          rgba(142,216,255,.16),
          rgba(184,167,255,.12)
        );
      border: 1px solid rgba(142,216,255,.18);
      box-shadow:
        0 0 35px rgba(142,216,255,.08);
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-heading h1 {
      margin: 0 0 9px;
      color: #f4f8fb;
      font-family: "Estedad", sans-serif;
      font-size: 27px;
      font-weight: 800;
    }

    .auth-heading p {
      margin: 0;
      color: rgba(220,230,238,.58);
      font-family: "Estedad", sans-serif;
      font-size: 13px;
      line-height: 1.9;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      margin-bottom: 24px;
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
    }

    .auth-tab {
      height: 42px;
      border: 0;
      border-radius: 9px;
      color: rgba(225,235,242,.55);
      background: transparent;
      font-family: "Estedad", sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .25s ease;
    }

    .auth-tab:hover {
      color: #fff;
    }

    .auth-tab.active {
      color: #eefaff;
      background:
        linear-gradient(
          135deg,
          rgba(142,216,255,.13),
          rgba(184,167,255,.09)
        );
      box-shadow:
        inset 0 0 0 1px rgba(142,216,255,.10);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 8px;
      color: rgba(235,242,247,.76);
      font-family: "Estedad", sans-serif;
      font-size: 12px;
      font-weight: 600;
    }

    .auth-input {
      width: 100%;
      height: 48px;
      box-sizing: border-box;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      outline: none;
      color: #f3f8fb;
      background: rgba(0,0,0,.18);
      font-family: "Inter", "Estedad", sans-serif;
      font-size: 13px;
      direction: ltr;
      text-align: left;
      transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .auth-input::placeholder {
      color: rgba(220,230,238,.30);
    }

    .auth-input:focus {
      border-color: rgba(142,216,255,.34);
      background: rgba(0,0,0,.25);
      box-shadow:
        0 0 0 4px rgba(142,216,255,.055);
    }

    .auth-submit {
      width: 100%;
      height: 50px;
      margin-top: 7px;
      border: 1px solid rgba(142,216,255,.18);
      border-radius: 13px;
      color: #eefaff;
      background:
        linear-gradient(
          135deg,
          rgba(142,216,255,.16),
          rgba(184,167,255,.13)
        );
      font-family: "Estedad", sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .auth-submit:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(
          135deg,
          rgba(142,216,255,.22),
          rgba(184,167,255,.18)
        );
      box-shadow:
        0 12px 30px rgba(0,0,0,.25),
        0 0 25px rgba(142,216,255,.06);
    }

    .auth-submit:active {
      transform: translateY(0);
    }

    .auth-submit:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .auth-message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 11px;
      font-family: "Estedad", sans-serif;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      color: #ffb8c0;
      background: rgba(255,80,100,.07);
      border: 1px solid rgba(255,80,100,.13);
    }

    .auth-message.success {
      color: #bcebd8;
      background: rgba(80,220,160,.07);
      border: 1px solid rgba(80,220,160,.13);
    }

    .auth-back {
      display: flex;
      justify-content: center;
      margin-top: 23px;
    }

    .auth-back a {
      color: rgba(220,230,238,.45);
      font-family: "Estedad", sans-serif;
      font-size: 12px;
      text-decoration: none;
      transition: color .2s ease;
    }

    .auth-back a:hover {
      color: #dff6ff;
    }

    @media (max-width: 520px) {

      .auth-shell {
        width: min(100% - 20px, 470px);
      }

      .auth-card {
        padding: 25px 20px;
        border-radius: 20px;
      }

      .auth-heading h1 {
        font-size: 24px;
      }

    }

  </style>

</head>

<body class="auth-page">

  <main class="auth-shell">

    <section class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-mark">
          LF
        </div>
      </div>

      <div class="auth-heading">

        <h1>LoyalForge</h1>

        <p>
          وارد حساب خودت شو یا یک حساب جدید بساز.
        </p>

      </div>

      <div class="auth-tabs">

        <button
          class="auth-tab active"
          id="loginTab"
          type="button"
        >
          ورود
        </button>

        <button
          class="auth-tab"
          id="registerTab"
          type="button"
        >
          ثبت‌نام
        </button>

      </div>


      <!-- =====================================================
           LOGIN
      ====================================================== -->

      <form
        class="auth-form active"
        id="loginForm"
      >

        <div class="auth-field">

          <label for="loginEmail">
            ایمیل
          </label>

          <input
            class="auth-input"
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="auth-field">

          <label for="loginPassword">
            رمز عبور
          </label>

          <input
            class="auth-input"
            id="loginPassword"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="auth-submit"
          id="loginSubmit"
          type="submit"
        >
          ورود به حساب
        </button>
